# Build everything and run the tests that need neither a GPU nor a model (ctest -L cpu): GitHub's macOS runners are
# virtual machines without a usable Metal device, and the models are 96-178 GB.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS 27 with Xcode 27 (Apple Silicon): the project builds as C++26 with Xcode 27's clang.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install cmake ninja
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
          xcodebuild -version
          cmake --version
          ninja --version

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build -L cpu --output-on-failure
